const questions = [
 {id:1,lesson:"Aula 1",type:"Múltipla escolha",skill:"Reconhecer equilíbrio dinâmico",prompt:"Em um recipiente fechado, a reação entre nitrogênio e hidrogênio produz amônia. Depois de algum tempo, as concentrações permanecem constantes, mas as reações direta e inversa continuam acontecendo. O que caracteriza esse estado?",options:["A reação parou completamente.","A reação atingiu equilíbrio químico dinâmico.","Só a reação direta continua.","Os reagentes foram totalmente consumidos."],answer:"A reação atingiu equilíbrio químico dinâmico."},
 {id:2,lesson:"Aula 2",type:"Múltipla escolha",skill:"Escrever a expressão de Q",prompt:"Para a reação aA + bB ⇌ cC + dD, um estudante precisa registrar a fotografia do sistema em um instante qualquer. Qual expressão representa corretamente o quociente de equilíbrio Q?",options:["Q = [A]ᵃ[B]ᵇ / [C]ᶜ[D]ᵈ","Q = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ","Q = [A+B+C+D] / abcd","Q = [C+D] / [A+B]"],answer:"Q = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ"},
 {id:3,lesson:"Aula 3",type:"Múltipla escolha",skill:"Distinguir Q de Kc",prompt:"Uma turma compara duas grandezas para analisar uma reação. Qual afirmação diferencia corretamente Q de Kc?",options:["Q só pode ser calculado no equilíbrio.","Kc muda a cada instante e Q é constante.","Q usa concentrações do instante; Kc usa concentrações no equilíbrio, na mesma temperatura.","Q e Kc sempre têm valores diferentes."],answer:"Q usa concentrações do instante; Kc usa concentrações no equilíbrio, na mesma temperatura."},
 {id:4,lesson:"Aula 4",type:"Múltipla escolha",skill:"Prever o sentido da reação",prompt:"Para uma reação, foram calculados Q = 0,020 e Kc = 0,100. O sistema ainda não está em equilíbrio. Para qual lado a reação tende a evoluir?",options:["Para a direita, formando mais produtos.","Para a esquerda, formando mais reagentes.","Não há tendência de mudança.","A reação se torna irreversível."],answer:"Para a direita, formando mais produtos."},
 {id:5,lesson:"Aula 5",type:"Múltipla escolha",skill:"Calcular e comparar Q e Kc",prompt:"Na reação N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), considere [N₂] = 0,50 mol/L, [H₂] = 1,50 mol/L e [NH₃] = 0,50 mol/L. Sabendo que Kc = 0,10, o cálculo de Q indica qual conclusão?",options:["Q ≈ 0,148; como Q > Kc, o sistema tende para a esquerda.","Q ≈ 0,0148; como Q < Kc, o sistema tende para a direita.","Q = 0,10; o sistema já está em equilíbrio.","Q ≈ 1,48; a reação se torna irreversível."],answer:"Q ≈ 0,148; como Q > Kc, o sistema tende para a esquerda."},
 {id:6,lesson:"Aula 6",type:"Múltipla escolha",skill:"Interpretar o valor de Kc",prompt:"Em duas reações realizadas na mesma temperatura, uma apresenta Kc = 6,45 × 10⁵ e outra Kc = 2,37 × 10⁻³. Qual interpretação é adequada?",options:["A primeira favorece produtos; a segunda favorece reagentes.","As duas favorecem igualmente os reagentes.","Kc não permite comparar a posição do equilíbrio.","A segunda obrigatoriamente é mais rápida."],answer:"A primeira favorece produtos; a segunda favorece reagentes."},
 {id:7,lesson:"Aula 7",type:"Dissertativa",skill:"Relacionar equilíbrio e indústria",prompt:"Uma indústria deseja aumentar a produção de amônia e precisa justificar suas decisões com base no equilíbrio químico. Explique como a comparação entre Q e Kc pode orientar a análise do sistema e cite uma condição que deve ser mantida sob controle.",placeholder:"Escreva uma justificativa com comparação entre Q e Kc e uma condição experimental relevante."},
 {id:8,lesson:"Aula 8",type:"Dissertativa",skill:"Aplicar equilíbrio ao corpo humano",prompt:"O sangue precisa manter seu pH dentro de uma faixa estreita. Explique por que um sistema tampão pode ser compreendido como um equilíbrio químico e qual seria o risco de uma alteração intensa nas concentrações das espécies envolvidas.",placeholder:"Relacione equilíbrio, pH, concentrações e estabilidade do organismo."},
 {id:9,lesson:"Aula 9",type:"Dissertativa",skill:"Interpretar impactos ambientais",prompt:"O aumento de CO₂ atmosférico altera os equilíbrios químicos entre a água do oceano e as espécies carbonatadas. Explique, em linguagem científica, como uma mudança de concentração pode deslocar um equilíbrio e produzir consequências ambientais.",placeholder:"Descreva o deslocamento do equilíbrio e uma consequência ambiental possível."},
 {id:10,lesson:"Aula 10",type:"Múltipla escolha",skill:"Integrar conceitos",prompt:"Um laboratório acompanha uma reação reversível e observa Q = Kc durante vários minutos. Qual conclusão é mais adequada para comunicar no relatório?",options:["O sistema está em equilíbrio dinâmico e as velocidades direta e inversa se igualam.","A reação parou e não há mais transformação molecular.","Todos os reagentes foram convertidos em produtos.","O valor de Kc deve mudar a cada leitura."],answer:"O sistema está em equilíbrio dinâmico e as velocidades direta e inversa se igualam."},
];

// ---- Estado da aplicação ----
const state = {
  turma: "",
  studentName: "",
  answers: {},   // { [questionId]: string }
  sent: false,
  sending: false,
};

function getStudent(){
  if(!state.turma || !state.studentName) return null;
  const list = CLASSES[state.turma] || [];
  return list.find(s => s.name === state.studentName) || null;
}

function answeredCount(){
  return Object.keys(state.answers).filter(k => (state.answers[k] || "").trim() !== "").length;
}

// ---- Construção do DOM ----
const root = document.getElementById("root");

function el(tag, attrs = {}, children = []){
  const node = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k === "class") node.className = v;
    else if(k === "html") node.innerHTML = v;
    else if(k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else if(v !== undefined && v !== null) node.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c=>{
    if(c === null || c === undefined) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

function render(){
  root.innerHTML = "";
  const student = getStudent();
  const answered = answeredCount();

  // ---- Topbar ----
  const topbar = el("header", {class:"topbar"}, [
    el("div", {class:"brand"}, [
      el("div", {class:"logo", html: logoSVG()}),
      el("div", {}, [
        el("span", {class:"eyebrow"}, "FICHA DE INVESTIGAÇÃO · 3º BIMESTRE"),
        el("h1", {}, SCHOOL_NAME),
      ]),
    ]),
    el("div", {class:"progress-chip"}, [
      el("span", {}, String(answered).padStart(2,"0")),
      el("small", {}, "/ " + questions.length + " respondidas"),
    ]),
  ]);

  // ---- Intro / identificação ----
  const turmaSelect = el("select", {onchange:(e)=>{ state.turma = e.target.value; state.studentName=""; render(); }}, [
    el("option", {value:""}, "Selecione sua turma"),
    ...Object.keys(CLASSES).map(t => el("option", {value:t, ...(state.turma===t?{selected:"selected"}:{})}, t)),
  ]);

  const nameOptions = [el("option", {value:""}, state.turma ? "Selecione seu nome" : "Selecione a turma primeiro")];
  if(state.turma){
    (CLASSES[state.turma]||[]).forEach(s=>{
      nameOptions.push(el("option", {value:s.name, ...(state.studentName===s.name?{selected:"selected"}:{})}, `${s.number}. ${s.name}`));
    });
  }
  const nameSelect = el("select", {
    disabled: state.turma ? undefined : "disabled",
    onchange:(e)=>{ state.studentName = e.target.value; render(); }
  }, nameOptions);

  const identityCard = el("div", {class:"identity-card"}, [
    el("div", {class:"section-label"}, [el("span",{html:ICONS.user}), " identificação do estudante"]),
    el("label", {}, ["Turma", turmaSelect]),
    el("label", {}, ["Nome", nameSelect]),
    student ? el("div", {class:"student-meta"}, [
      el("span", {}, ["Nº de chamada ", el("strong", {}, String(student.number))]),
      el("span", {}, ["RA ", el("strong", {}, `${student.ra}-${student.digit}`)]),
      el("span", {}, student.email || "E-mail não informado"),
    ]) : null,
  ]);

  const introPanel = el("section", {class:"intro-panel"}, [
    el("div", {}, [
      el("p", {class:"kicker"}, "QUÍMICA · 3ª SÉRIE F"),
      el("h2", {}, ["Equilíbrio químico", el("br"), el("em", {}, "em movimento")]),
      el("p", {class:"intro-copy"}, "Observe as evidências, compare Q com Kc e registre suas hipóteses. Esta atividade reúne situações de laboratório, indústria, corpo humano e meio ambiente."),
    ]),
    identityCard,
  ]);

  const routeLine = el("div", {class:"route-line"}, [
    el("span", {}, "01"),
    el("span", {class:"line"}),
    el("span", {}, "LEIA · CALCULE · JUSTIFIQUE"),
  ]);

  // ---- Régua lateral ----
  const ruler = el("aside", {class:"investigation-ruler", "aria-label":"Régua vertical de investigação"}, [
    el("div", {class:"ruler-caption"}, ["percurso", el("br"), "científico"]),
    ...questions.map(q => el("span", {
      class: "ruler-dot" + ((state.answers[q.id]||"").trim() ? " done" : ""),
      "aria-label": q.lesson + ((state.answers[q.id]||"").trim() ? " respondida" : "")
    }, String(q.id).padStart(2,"0"))),
  ]);

  // ---- Questões ----
  const questionsSection = el("section", {class:"questions"},
    questions.map((q, index) => renderQuestion(q, index))
  );

  const investigationLayout = el("div", {class:"investigation-layout"}, [ruler, questionsSection]);

  // ---- Painel de envio ----
  const submitBtnLabel = state.sent
    ? el("span",{},[el("span",{html:ICONS.check}), " Resposta registrada"])
    : el("span",{},[el("span",{html:ICONS.send}), " " + (state.sending ? "Enviando…" : "Enviar atividade")]);

  const submitBtn = el("button", {
    class:"submit-button",
    ...(state.sending ? {disabled:"disabled"} : {}),
    onclick: submit,
  }, submitBtnLabel);

  const submitPanel = el("section", {class:"submit-panel"}, [
    el("div", {}, [
      el("p", {class:"kicker"}, "CONFERÊNCIA FINAL"),
      el("h2", {}, "Pronto para registrar?"),
      el("p", {}, "Confira sua identificação e certifique-se de que as 10 questões foram respondidas."),
    ]),
    submitBtn,
  ]);

  const successNote = state.sent ? el("div", {class:"success-note"}, [
    el("span",{html:ICONS.clipboard}),
    el("span", {}, "Registro enviado. Suas respostas objetivas serão comparadas na planilha; as dissertativas ficarão disponíveis para correção manual."),
  ]) : null;

  const main = el("main", {class:"content"}, [introPanel, routeLine, investigationLayout, submitPanel, successNote]);

  const footer = el("footer", {}, [
    el("span",{html:ICONS.flask}),
    " Aprendizagens essenciais · Equilíbrio químico e quociente de equilíbrio ",
    el("span", {}, "2026"),
  ]);

  root.appendChild(el("div", {class:"app-shell"}, [topbar, main, footer]));
}

function renderQuestion(q, index){
  const value = state.answers[q.id] || "";
  const isAnswered = value.trim() !== "";

  const head = el("div", {class:"question-head"}, [
    el("span", {class:"evidence-mark", "aria-hidden":"true"}, index%2===0 ? "Q  ↔  Kc" : "[ ]  [ ]  [ ]"),
    el("span", {class:"tag"}, q.type),
    el("span", {class:"skill"}, q.skill),
  ]);

  const img = el("img", {
    class:"question-image",
    src: QUESTION_IMAGES[q.id] || fallbackArt(q.id),
    alt: `Ilustração didática relacionada à ${q.lesson}: ${q.skill}`,
    loading:"lazy", decoding:"async",
    onerror: function(){ this.onerror=null; this.src = fallbackArt(q.id); },
  });

  let answerField;
  if(q.options){
    answerField = el("div", {class:"options"}, q.options.map((option,i)=>
      el("button", {
        type:"button",
        class:"option" + (value===option ? " selected" : ""),
        onclick: ()=>{ state.answers[q.id] = option; render(); },
      }, [
        el("span", {class:"option-letter"}, String.fromCharCode(65+i)),
        option,
      ])
    ));
  } else {
    answerField = el("textarea", {
      rows:5,
      placeholder: q.placeholder,
      oninput: (e)=>{ state.answers[q.id] = e.target.value; updateProgressOnly(); },
    });
    answerField.value = value;
  }

  const footerRow = el("div", {class:"question-footer"}, [
    el("span", {}, index<6 ? "Selecione uma alternativa" : "Resposta aberta · correção docente"),
    isAnswered ? el("span",{html:ICONS.check}) : null,
  ]);

  const body = el("div", {class:"question-body"}, [head, el("h3", {}, q.prompt), img, answerField, footerRow]);
  const marker = el("div", {class:"question-marker"}, [
    el("span", {}, String(q.id).padStart(2,"0")),
    el("small", {}, q.lesson),
  ]);

  return el("article", {class:`question-card card-variant-${index%4}`}, [marker, body]);
}

// Atualiza só o chip de progresso e a régua, sem perder o foco do textarea ao digitar
function updateProgressOnly(){
  const answered = answeredCount();
  const chip = document.querySelector(".progress-chip span");
  if(chip) chip.textContent = String(answered).padStart(2,"0");
  document.querySelectorAll(".ruler-dot").forEach((dot, i)=>{
    const q = questions[i];
    const done = (state.answers[q.id]||"").trim() !== "";
    dot.classList.toggle("done", done);
  });
  document.querySelectorAll(".question-card").forEach((card, i)=>{
    const q = questions[i];
    const done = (state.answers[q.id]||"").trim() !== "";
    const footer = card.querySelector(".question-footer");
    if(footer){
      let checkEl = footer.querySelector("[data-check-icon]");
      if(done && !checkEl){
        const span = document.createElement("span");
        span.setAttribute("data-check-icon","1");
        span.innerHTML = ICONS.check;
        footer.appendChild(span);
      } else if(!done && checkEl){
        checkEl.remove();
      }
    }
  });
}

function logoSVG(){
  return `<svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
    <rect width="50" height="50" fill="#123b70"/>
    <path d="M20 10v10.5a4 4 0 0 1-.9 2.5L11 33a3.5 3.5 0 0 0 2.8 5.6h22.4A3.5 3.5 0 0 0 39 33l-8.1-10a4 4 0 0 1-.9-2.5V10" fill="none" stroke="#f7f3ea" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M17 10h16" stroke="#f7f3ea" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="22" cy="30" r="2" fill="#176b4f"/>
    <circle cx="28" cy="26" r="1.6" fill="#b34b3d"/>
    <circle cx="25" cy="34" r="1.6" fill="#f7f3ea"/>
  </svg>`;
}

// ---- Envio ----
async function submit(){
  const student = getStudent();
  const answered = answeredCount();
  if(!student || answered < questions.length){
    alert("Selecione seu nome e responda às 10 questões antes de enviar.");
    return;
  }
  state.sending = true;
  render();

  const payload = {
    school: SCHOOL_NAME,
    turma: state.turma,
    studentName: student.name,
    ra: student.ra,
    raDigit: student.digit,
    email: student.email,
    answers: state.answers,
    submittedAt: new Date().toISOString(),
  };

  try{
    if(APPS_SCRIPT_URL.startsWith("http")){
      await fetch(APPS_SCRIPT_URL, {
        method:"POST", mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(payload),
      });
    }
    try{ localStorage.setItem("atividade-quimica-ultima", JSON.stringify(payload)); }catch(e){}
    state.sent = true;
  } finally {
    state.sending = false;
    render();
  }
}

render();

</script>
